[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-course-task-api"
version = "0.1.0"
description = "Small FastAPI task service used in the Copilot course"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
